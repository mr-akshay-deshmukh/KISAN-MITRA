<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F1411" />
      <stop offset="50%" stop-color="#14211A" />
      <stop offset="100%" stop-color="#090E0B" />
    </linearGradient>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C2D66E" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C2D66E" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#10B981" stop-opacity="0.3" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)" />
  <rect x="12" y="12" width="488" height="488" rx="98" fill="none" stroke="url(#ringGrad)" stroke-width="6" />

  <!-- Soft Ambient Glow behind icon -->
  <circle cx="256" cy="256" r="140" fill="#C2D66E" fill-opacity="0.12" filter="url(#glow)" />

  <!-- Logo Graphics: Sprout & Harvest Wheat Symbol -->
  <g transform="translate(256, 256)">
    <!-- Soil / Ground Arc -->
    <path d="M -120 120 C -60 145 60 145 120 120" stroke="#C2D66E" stroke-width="12" stroke-linecap="round" fill="none" opacity="0.6" />
    <path d="M -80 145 C -40 160 40 160 80 145" stroke="#10B981" stroke-width="8" stroke-linecap="round" fill="none" opacity="0.4" />
    
    <!-- Central Stem -->
    <path d="M 0 120 Q 0 0 10 -80" stroke="url(#leafGrad)" stroke-width="18" stroke-linecap="round" fill="none" />
    
    <!-- Left Leaf -->
    <path d="M 0 20 C -60 -20 -110 10 -130 -30 C -120 -80 -70 -100 0 -30 Z" fill="url(#leafGrad)" />
    
    <!-- Right Leaf -->
    <path d="M 5 -30 C 65 -70 125 -40 140 -80 C 120 -130 65 -140 5 -70 Z" fill="url(#leafGrad)" />
    
    <!-- Golden Sun / AI Sparkle Core -->
    <circle cx="90" cy="-90" r="22" fill="#FACC15" filter="url(#glow)" />
    <circle cx="90" cy="-90" r="14" fill="#FEF08A" />
  </g>
</svg>
