    <script>
      // Ignore Vite HMR WebSocket connection warnings in AI Studio preview iframe
      (function() {
        var origConsoleError = console.error;
        console.error = function() {
          var args = Array.prototype.slice.call(arguments);
          var msg = args.map(function(a) {
            return typeof a === 'string' ? a : (a && a.message) || '';
          }).join(' ');
          if (msg.indexOf('[vite]') !== -1 && (msg.indexOf('websocket') !== -1 || msg.indexOf('WebSocket') !== -1 || msg.indexOf('connect') !== -1)) {
            return;
          }
          if (msg.indexOf('vite-plugin-pwa') !== -1) {
            return;
          }
          if (msg.indexOf('[GSI_LOGGER]') !== -1 || msg.indexOf('Failed to open popup window') !== -1) {
            return;
          }
          return origConsoleError.apply(console, arguments);
        };
      })();
    </script>
